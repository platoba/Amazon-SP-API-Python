[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-sp-api-lite"
version = "5.1.0"
description = "Lightweight Amazon SP-API Python SDK — async client, 13 API modules, pagination, middleware, retry engine, validators, metrics, data models, webhooks, sandbox, batch ops, caching, CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "platoba"}]
keywords = ["amazon", "sp-api", "selling-partner", "ecommerce", "fba", "mws", "async", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business",
    "Framework :: AsyncIO",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
async = [
    "aiohttp>=3.8.0",
]
aws = [
    "boto3>=1.26.0",
]
all = [
    "aiohttp>=3.8.0",
    "boto3>=1.26.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "aiohttp>=3.8.0",
]

[project.scripts]
sp-api = "sp_api.cli:main"

[project.urls]
Homepage = "https://github.com/platoba/Amazon-SP-API-Python"
Repository = "https://github.com/platoba/Amazon-SP-API-Python"
Issues = "https://github.com/platoba/Amazon-SP-API-Python/issues"
Changelog = "https://github.com/platoba/Amazon-SP-API-Python/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["sp_api*"]

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
